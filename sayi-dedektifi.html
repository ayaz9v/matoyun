<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAYI DEDEKTİFİ: Matematiksel Gizemler</title>
<style>
:root{--bg:#0a0f15;--panel:#121b26;--panel2:#182433;--panel3:#1f2e40;--line:#2a3c52;--text:#e8eef5;--muted:#93a6bb;--accent:#46d3c3;--accent2:#2aa597;--amber:#f2b84b;--red:#f07070;--green:#5fd38d;--violet:#a493ff;--mono:"Cascadia Mono",Consolas,"Courier New",ui-monospace,monospace;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:clamp(17px,.45vw + 12px,23px);line-height:1.45;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(70,211,195,.10),transparent 55%),radial-gradient(ellipse at 110% 110%,rgba(164,147,255,.08),transparent 50%),linear-gradient(rgba(70,211,195,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(70,211,195,.035) 1px,transparent 1px);
  background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
small{font-size:.75em}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
/* Üst bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:1rem;padding:.55rem 1.2rem;background:rgba(10,15,21,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:.14em;font-size:1.05em;cursor:pointer;background:none;border:0;padding:0}
.logo .mark{width:2.1em;height:2.1em;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-size:.9em;box-shadow:0 0 18px rgba(70,211,195,.35)}
.logo small{display:block;font-weight:500;letter-spacing:.06em;color:var(--muted);font-size:.62em}
.tb-stats{display:flex;align-items:center;gap:1.1rem;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;flex-direction:column;line-height:1.1}
.chip .lbl{font-size:.62em;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.chip b{font-family:var(--mono);font-size:1.05em}
.chip.rank b{color:var(--amber);font-family:inherit}
.pbar{width:150px;height:10px;border-radius:6px;background:var(--panel3);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s}
.tbtn{min-height:46px;padding:.3rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:.85em;display:flex;align-items:center;gap:.4rem}
.tbtn.on{border-color:var(--accent);color:var(--accent)}
/* Genel */
main{padding:1.2rem clamp(.8rem,2vw,2rem) 3rem;max-width:1800px;margin:0 auto}
.panel{background:linear-gradient(180deg,var(--panel),#0f1720);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{min-height:56px;padding:.55rem 1.3rem;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent);background:var(--panel3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#04201c;border-color:transparent;font-weight:800}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:rgba(242,184,75,.5);color:var(--amber)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sec{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:1.1rem 0 .55rem;font-weight:700}
.sec small{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.sec:first-child{margin-top:0}
.lvl{font-size:.68em;padding:.18em .7em;border-radius:99px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid}
.lvl.kolay{color:var(--green);border-color:rgba(95,211,141,.5);background:rgba(95,211,141,.08)}
.lvl.orta{color:var(--amber);border-color:rgba(242,184,75,.5);background:rgba(242,184,75,.08)}
.lvl.ileri{color:var(--red);border-color:rgba(240,112,112,.5);background:rgba(240,112,112,.08)}
/* Giriş */
.intro{max-width:980px;margin:4vh auto 0;text-align:center}
.intro h1{font-size:clamp(2.2rem,5vw,4.2rem);letter-spacing:.12em;font-weight:900;background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .sub{font-size:1.25em;color:var(--amber);letter-spacing:.2em;margin:.4rem 0 1.6rem;text-transform:uppercase}
.intro .brief{text-align:left;font-size:1.05em}
.intro .brief p{margin:.5rem 0}
.intro .stamp-top{display:inline-block;font-family:var(--mono);color:var(--red);border:2px solid var(--red);padding:.1em .7em;border-radius:6px;transform:rotate(-3deg);letter-spacing:.2em;margin-bottom:1rem;font-weight:700}
.opts{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin:1.4rem 0}
.opt-card{flex:1 1 260px;text-align:left;padding:1rem 1.1rem;border-radius:14px;border:2px solid var(--line);background:var(--panel2)}
.opt-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(70,211,195,.15)}
.opt-card b{display:block;font-size:1.05em;margin-bottom:.2rem}
.name-in{font-size:1.2em;padding:.5rem .9rem;border-radius:10px;border:1px solid var(--line);background:#0c131b;width:min(320px,90%);text-align:center}
/* Pano */
.board{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:1.2rem;align-items:start}
@media (max-width:1050px){.board{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:1rem;position:sticky;top:5.2rem}
@media (max-width:1050px){.side{position:static}}
.rank-name{font-size:1.5em;font-weight:800;color:var(--amber);margin:.2rem 0 .6rem}
.big{font-family:var(--mono);font-size:2.2em;font-weight:700;color:var(--accent)}
.lbl{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rbar{height:12px;border-radius:8px;background:var(--panel3);overflow:hidden;margin:.3rem 0 .4rem}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#b98522,var(--amber))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:.5rem;margin-top:.6rem}
.badge{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:1.35em;border:2px dashed var(--line);color:#3c5068;background:#0c131b;position:relative}
.badge.on{border:2px solid var(--amber);color:var(--amber);background:radial-gradient(circle,rgba(242,184,75,.2),transparent 70%);box-shadow:0 0 14px rgba(242,184,75,.25)}
.badge-list{margin-top:.6rem;font-size:.78em;display:flex;flex-direction:column;gap:.25rem}
.badge-list .on{color:var(--amber)}
.chapters{display:flex;flex-direction:column;gap:1.2rem}
.chapter{padding:1rem 1.2rem 1.2rem}
.ch-head{display:flex;align-items:center;gap:.9rem;margin-bottom:.9rem}
.ch-icon{width:2.6em;height:2.6em;border-radius:12px;display:grid;place-items:center;font-size:1.3em;background:var(--panel3);border:1px solid var(--line);color:var(--accent);flex:none}
.ch-head h3{font-size:1.15em}
.ch-head p{margin:.1rem 0 0;color:var(--muted);font-size:.85em}
.ch-prog{margin-left:auto;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem}
.case-card{position:relative;text-align:left;padding:.9rem 1rem 1rem;border-radius:4px 14px 14px 14px;border:1px solid var(--line);background:linear-gradient(160deg,#1b2a3b,#131d29);min-height:150px;display:flex;flex-direction:column;gap:.45rem;overflow:hidden;transition:transform .12s,border-color .15s}
.case-card::before{content:"";position:absolute;top:0;left:0;width:42%;height:6px;background:var(--line)}
.case-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.case-card.lvl-kolay::before{background:var(--green)}.case-card.lvl-orta::before{background:var(--amber)}.case-card.lvl-ileri::before{background:var(--red)}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.cc-code{font-family:var(--mono);color:var(--muted);font-size:.78em;letter-spacing:.1em}
.cc-title{font-size:1.12em;font-weight:700}
.cc-foot{margin-top:auto;font-size:.8em;color:var(--muted)}
.case-card.solved .cc-foot{color:var(--green)}
.stamp{position:absolute;right:.6rem;bottom:.7rem;transform:rotate(-12deg);border:2px solid var(--green);color:var(--green);font-family:var(--mono);font-weight:800;letter-spacing:.15em;padding:.05em .45em;border-radius:6px;font-size:.78em;opacity:.85}
.case-card.locked{opacity:.45;cursor:not-allowed}
.case-card.locked:hover{transform:none;border-color:var(--line)}
/* Dosya ekranı */
.case-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.case-title{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.case-title .code{font-family:var(--mono);color:var(--muted);letter-spacing:.12em}
.case-title h2{font-size:1.45em}
.case-meta{margin-left:auto;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.pot{font-family:var(--mono);padding:.35rem .8rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.pot b{color:var(--accent)}
.timer{font-family:var(--mono);font-size:1.15em;padding:.3rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-right:.4rem}
.timer.over{color:var(--amber)}
.case-body{display:grid;grid-template-columns:minmax(320px,.9fr) 1.25fr;gap:1.2rem;align-items:start}
@media (max-width:1100px){.case-body{grid-template-columns:1fr}}
.file{position:relative;background:linear-gradient(180deg,#16212e,#101821);border-left:4px solid var(--amber)}
.file .story{font-size:1em;color:#d5dee8;border-bottom:1px dashed var(--line);padding-bottom:.8rem;margin-bottom:.4rem}
.file-tag{position:absolute;top:-.8rem;right:1rem;background:var(--amber);color:#2b1d00;font-weight:800;font-size:.7em;letter-spacing:.14em;padding:.15rem .6rem;border-radius:6px}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.clue{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .7rem;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line);cursor:pointer;transition:opacity .15s,background .15s}
.clue:hover{background:rgba(70,211,195,.06)}
.clue .cn{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--panel3);font-family:var(--mono);font-size:.8em;color:var(--accent)}
.clue.marked{opacity:.45}
.clue.marked .cn{background:var(--accent);color:#04201c}
.clue.bad{border-color:var(--red);background:rgba(240,112,112,.08)}
.clue.lg{font-size:1.08em}
.ev-list{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
@media (max-width:600px){.ev-list{grid-template-columns:1fr}}
.ev{display:flex;gap:.6rem;align-items:center;padding:.4rem .6rem;border-radius:8px;background:var(--panel2);font-size:.9em}
.ev b{font-family:var(--mono);color:var(--amber);font-size:1.15em}
.work{min-height:300px}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.2rem;justify-content:flex-end}
.feedback{margin-top:1rem;border-radius:12px;padding:0;transition:all .2s}
.feedback:not(:empty){padding:.8rem 1rem;border:1px solid var(--line)}
.feedback.ok{border-color:var(--green);background:rgba(95,211,141,.08)}
.feedback.bad{border-color:var(--red);background:rgba(240,112,112,.07)}
.feedback.soft{border-color:var(--amber);background:rgba(242,184,75,.07)}
.parts{list-style:none;padding:0;margin:.4rem 0 0;display:flex;gap:1rem;flex-wrap:wrap}
.parts .ok{color:var(--green)}.parts .no{color:var(--red)}
.hint-list{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.hint{padding:.6rem .9rem;border-radius:10px;border:1px dashed var(--violet);background:rgba(164,147,255,.07)}
.hint b{color:var(--violet)}
/* Zaman çizelgesi */
.tl-pool{display:flex;flex-wrap:wrap;gap:.5rem;min-height:64px;padding:.5rem;border-radius:12px;border:1px dashed var(--line)}
.tl-card{min-height:56px;padding:.35rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:.5rem;max-width:100%}
.tl-card b{font-family:var(--mono);color:var(--amber);font-size:1.3em}
.tl-card span{font-size:.8em;color:var(--muted);text-align:left}
.tl-track{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.8rem}
.slot{min-width:72px;min-height:72px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--mono);color:#3c5068;font-size:1.1em;background:#0c131b;padding:0 .4rem}
.slot.filled{border:2px solid var(--accent);color:var(--text);background:rgba(70,211,195,.08)}
.slot.filled b{font-size:1.5em;color:var(--accent)}
.slot small{display:block;color:var(--muted);font-size:.55em;line-height:1}
.tl-track .arr{color:var(--muted)}
.qs{display:flex;flex-direction:column;gap:.7rem}
.q{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.6rem .8rem;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.q>span{flex:1 1 260px}
input.num,input.tin{width:7.5em;min-height:54px;padding:.3rem .6rem;border-radius:10px;border:2px solid var(--line);background:#0c131b;font-family:var(--mono);font-size:1.2em;text-align:center;outline:none}
input.num:focus,input.tin:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(70,211,195,.18)}
input.num.wrong,input.tin.wrong{border-color:var(--red)}
input.num.right,input.tin.right{border-color:var(--green)}
.yn{display:flex;gap:.5rem}
.yn button,.pick{min-height:52px;padding:.3rem 1rem;border-radius:10px;border:2px solid var(--line);background:var(--panel2);font-weight:600}
.yn button.sel,.pick.sel{border-color:var(--accent);background:rgba(70,211,195,.14);color:var(--accent)}
/* Klavye */
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;margin-top:1rem;max-width:560px}
.kp{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--panel3);font-family:var(--mono);font-size:1.25em;font-weight:700}
.kp:active{background:var(--accent);color:#04201c}
.kp.wide{grid-column:span 3;font-family:inherit;font-size:.9em}
/* Izgara */
.grid-wrap{overflow-x:auto;padding:.3rem 0}
table.grid{border-collapse:separate;border-spacing:6px;margin:0 auto}
table.grid th{color:var(--muted);font-family:var(--mono);font-weight:600;font-size:.9em}
.cell{width:clamp(58px,5.4vw,86px);height:clamp(58px,5.4vw,86px);border-radius:12px;border:2px solid var(--line);background:#0c131b;font-family:var(--mono);font-size:1.45em;text-align:center;display:grid;place-items:center;outline:none;padding:0}
.cell.given{color:var(--amber);background:#18222e;border-color:#3a4a5e}
input.cell:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(70,211,195,.2)}
.cellw{position:relative}
.cellw.star::after{content:"★";position:absolute;top:-6px;right:-4px;color:var(--amber);font-size:.9em;text-shadow:0 0 6px rgba(242,184,75,.7);pointer-events:none}
.sumcell{font-family:var(--mono);color:var(--accent);font-size:.95em;text-align:center;padding-top:.2rem}
.sumcell.link{color:var(--amber);font-size:.72em}
/* Şifre */
.pairs{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;font-family:var(--mono);font-size:1.55em}
.pair{padding:.35rem 1rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;gap:.8rem}
.pair .ar{color:var(--accent)}
.pair.extra{border-color:var(--violet);background:rgba(164,147,255,.1)}
.pair.query{border-color:var(--accent)}
.opts-list{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;min-height:56px;padding:.5rem 1rem;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:1.1em}
.opt.sel{border-color:var(--accent);background:rgba(70,211,195,.12)}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:.35rem}
.alpha div{border-radius:8px;background:var(--panel2);border:1px solid var(--line);text-align:center;padding:.2rem 0;font-weight:700}
.alpha div small{display:block;font-family:var(--mono);color:var(--muted);font-weight:400}
.lslots{display:flex;gap:.5rem;flex-wrap:wrap}
.lslot{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.lslot .code{font-family:var(--mono);color:var(--amber);font-size:1.1em}
.lslot button{width:64px;height:68px;border-radius:12px;border:2px solid var(--line);background:#0c131b;font-size:1.6em;font-weight:800}
.lslot button.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(70,211,195,.2)}
.letters-pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:.35rem;margin-top:1rem}
.letters-pad button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel3);font-weight:800;font-size:1.1em}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-family:var(--mono);font-size:2em;justify-content:center;padding:1rem 0}
.eq .opbtn{width:1.9em;height:1.9em;border-radius:12px;border:2px dashed var(--accent);background:#0c131b;font-size:.9em;color:var(--accent);font-weight:800}
.eq .opbtn.filled{border-style:solid;background:rgba(70,211,195,.12)}
.eq .res{color:var(--amber)}
.contra-cards{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:700px){.contra-cards{grid-template-columns:1fr}}
.ccard{text-align:left;padding:.8rem 1rem;border-radius:12px;border:2px solid var(--line);background:var(--panel2);min-height:80px}
.ccard b{display:block;color:var(--amber);font-family:var(--mono);font-size:.8em;letter-spacing:.1em}
.ccard.sel{border-color:var(--red);background:rgba(240,112,112,.1)}
.ccard.sel b{color:var(--red)}
/* Final */
.stages{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.stg{padding:.35rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;line-height:1.15}
.stg b{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stg.cur{border-color:var(--accent)}.stg.cur b{color:var(--accent)}
.stg.done{border-color:var(--green)}.stg.done b{color:var(--green)}
.stg.lock{opacity:.5}
.stages i{color:var(--muted);font-style:normal}
.notebook{margin-bottom:1rem;padding:.7rem .9rem;border-radius:12px;border:1px solid var(--amber);background:rgba(242,184,75,.06)}
.notebook div{font-family:var(--mono)}
/* Açıklama */
.explain .banner{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:12px;background:rgba(95,211,141,.1);border:1px solid var(--green);color:var(--green);font-weight:700;font-size:1.1em}
.explain h3{font-size:1.4em;margin:1.1rem 0 .7rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.tab{min-height:52px;padding:.3rem 1rem;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.tab.sel{border-color:var(--accent);color:var(--accent);background:rgba(70,211,195,.1)}
.tab:disabled{opacity:.35;text-decoration:line-through}
.choice{display:block;width:100%;text-align:left;padding:.7rem 1rem;border-radius:12px;border:2px solid var(--line);background:var(--panel2);margin-bottom:.5rem;line-height:1.4}
.choice.sel{border-color:var(--accent);background:rgba(70,211,195,.1)}
.choice.right{border-color:var(--green)}.choice.wrongc{border-color:var(--red)}
textarea.ta{width:100%;min-height:150px;border-radius:12px;border:2px solid var(--line);background:#0c131b;padding:.8rem;resize:vertical;font-size:1em}
textarea.ta:focus{border-color:var(--accent);outline:none}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.72);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:1rem}
.modal{width:min(860px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#162231,#0f1720);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.6rem;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h2{font-size:1.6em;margin-bottom:.6rem}
.modal .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1.2rem}
.score-tbl{width:100%;border-collapse:collapse;font-size:.95em;margin:.6rem 0}
.score-tbl td{padding:.35rem .4rem;border-bottom:1px solid var(--line)}
.score-tbl td:last-child{text-align:right;font-family:var(--mono)}
.score-tbl tr.tot td{font-weight:800;color:var(--accent);font-size:1.15em;border-bottom:0}
.neg{color:var(--red)}.pos{color:var(--green)}
.newbadge{display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem;border-radius:12px;border:1px solid var(--amber);background:rgba(242,184,75,.08);margin-top:.5rem}
.newbadge .badge{width:52px;flex:none}
.t-tbl{width:100%;border-collapse:collapse;font-size:.8em}
.t-tbl th,.t-tbl td{padding:.35rem .4rem;border-bottom:1px solid var(--line);text-align:left}
.t-tbl th{color:var(--muted);font-weight:600}
.expl-item{padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;margin:.5rem 0;font-size:.9em}
.expl-item .tx{margin:.3rem 0;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--accent);padding:.7rem 1.2rem;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.loading{padding:3rem;text-align:center;color:var(--muted);font-family:var(--mono);letter-spacing:.1em}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="app"></main>
<div id="modalRoot"></div>
<script>
/* ===================== GEN-START (saf matematik, DOM yok) ===================== */
'use strict';
const ALPHA=['A','B','C','Ç','D','E','F','G','Ğ','H','I','İ','J','K','L','M','N','O','Ö','P','R','S','Ş','T','U','Ü','V','Y','Z'];
const LET='ABCDEFGH'.split('');
const COLS='ABCDE'.split('');
const UNIT_W=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'];
const TEN_W=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
function lastWord(n){n=Math.abs(n);if(n===0)return 'sıfır';if(n%10)return UNIT_W[n%10];if(n%100)return TEN_W[(n%100)/10];if(n%1000)return 'yüz';return 'bin';}
function ekOf(word,kind){const V='aeıioöuü';let lv='e';for(const ch of word)if(V.includes(ch))lv=ch;const last=word[word.length-1];const endsV=V.includes(last);const hard='fstkçşhp'.includes(last);const back='aıou'.includes(lv);const i4={a:'ı',ı:'ı',o:'u',u:'u',e:'i',i:'i',ö:'ü',ü:'ü'}[lv];const e2=back?'a':'e';
  switch(kind){case 'gen':return (endsV?'n':'')+i4+'n';case 'acc':return (endsV?'y':'')+i4;case 'dat':return (endsV?'y':'')+e2;case 'loc':return (hard?'t':'d')+e2;case 'abl':return (hard?'t':'d')+e2+'n';}return '';}
function ek(n,kind){return n+"'"+ekOf(lastWord(n),kind);}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function makeRng(seed){const f=mulberry32(seed>>>0);return{f,int(a,b){return a+Math.floor(f()*(b-a+1));},pick(arr){return arr[Math.floor(f()*arr.length)];},shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},chance(p){return f()<p;}};}
function wpick(rng,arr){const tot=arr.reduce((s,x)=>s+x.w,0);let r=rng.f()*tot;for(const x of arr){r-=x.w;if(r<=0)return x;}return arr[arr.length-1];}
const range=(a,b)=>{const o=[];for(let i=a;i<=b;i++)o.push(i);return o;};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const isSq=n=>n>0&&Number.isInteger(Math.sqrt(n));
function fmtT(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+'.'+String(mm).padStart(2,'0');}
function locT(m){m=((m%1440)+1440)%1440;const mm=m%60,h=Math.floor(m/60);const w=mm?lastWord(mm):lastWord(h);return fmtT(m)+"'"+ekOf(w,'loc');}
function parseT(s){s=String(s||'').trim().replace(/[:,\s]/g,'.');let h,m;if(/^\d{1,2}\.\d{2}$/.test(s)){[h,m]=s.split('.').map(Number);}else if(/^\d{3,4}$/.test(s)){h=Number(s.slice(0,-2));m=Number(s.slice(-2));}else return null;if(h>23||m>59)return null;return h*60+m;}
function parseNum(s){s=String(s||'').replace(/−/g,'-').replace(/\s/g,'');if(!/^-?\d+$/.test(s))return null;return parseInt(s,10);}
function durTxt(d,hours){if(!hours||d<60)return d+' dakika';const h=Math.floor(d/60),m=d%60;return h+' saat'+(m?' '+m+' dakika':'');}
function comb(terms){let s='';for(const [k,v] of terms){if(!k)continue;const abs=Math.abs(k);const body=v?(abs===1?v:abs+' × '+v):String(abs);if(!s)s=(k<0?'−':'')+body;else s+=(k<0?' − ':' + ')+body;}return s||'0';}
const pm=b=>b===0?'':(b>0?' + '+b:' − '+(-b));
function mkChoices(rng,correct,ds){const seen=new Set([correct]);const out=[{t:correct,ok:true}];for(const d of ds){if(out.length>=4)break;if(seen.has(d))continue;seen.add(d);out.push({t:d,ok:false});}return rng.shuffle(out);}

/* ---------- BÖLÜM 1: ZAMAN ÇİZELGESİ ---------- */
const EVENT_POOL=['Laboratuvar kapısı açıldı','Güvenlik kamerası kayda başladı','Numune kasaya kilitlendi','Alarm sistemi devre dışı kaldı','Bekçi kontrol turuna çıktı','Yazıcıdan bir rapor çıktı','Koridor ışıkları söndü','Arşivden bir dosya çıkarıldı','Telefon santrali sustu','Asansör 3. kata çıktı','Yedek jeneratör çalıştı','Bilgisayarda şifre değiştirildi','Kurye binaya girdi','Mikroskop ekranı kapandı','Kasa kapağı açıldı','Sunucu yeniden başlatıldı'];
function relPhrase(rng,s,r,d,hours){const amt=durTxt(Math.abs(d),hours),dir=d>0?'sonra':'önce';return rng.pick([
  `${s.L} olayı, ${r.L} olayından ${amt} ${dir} gerçekleşti.`,
  `${r.L} olayından ${amt} ${dir} ${s.L} olayı yaşandı.`,
  `${s.L} ile ${r.L} olayları arasında ${amt} var; ${s.L} olayı daha ${d>0?'geç':'erken'} yaşandı.`]);}
function genTimeline(rng,cfg){
  const n=cfg.n;const gaps=[];
  if(cfg.span){const minG=cfg.gap[0];const rest=cfg.span-minG*(n-1);if(rest<0)return null;const cuts=[];for(let i=0;i<n-2;i++)cuts.push(rng.int(0,rest));cuts.sort((a,b)=>a-b);let prev=0;for(const c of cuts){gaps.push(minG+c-prev);prev=c;}gaps.push(minG+rest-prev);}
  else for(let i=1;i<n;i++)gaps.push(5*rng.int(Math.ceil(cfg.gap[0]/5),Math.floor(cfg.gap[1]/5)));
  const t0=5*rng.int(cfg.start[0]/5,cfg.start[1]/5);
  const times=[t0];for(const g of gaps)times.push(times[times.length-1]+g);
  if(times[n-1]>=1440)return null;
  const names=rng.shuffle(EVENT_POOL).slice(0,n);
  const pos=rng.shuffle(range(0,n-1));
  const ev=[];for(let k=0;k<n;k++)ev.push({L:LET[k],name:names[k],t:times[pos[k]]});
  const chron=ev.slice().sort((a,b)=>a.t-b.t);
  const edges=[];
  if(cfg.tree==='chain'){for(let i=1;i<n;i++)edges.push([chron[i-1],chron[i]]);}
  else{const ord=rng.shuffle(ev);for(let i=1;i<n;i++)edges.push([ord[rng.int(0,i-1)],ord[i]]);}
  const anchor=cfg.anchor==='first'?chron[0]:cfg.anchor==='last'?chron[n-1]:cfg.anchor==='mid'?chron[rng.int(1,n-2)]:rng.pick(ev);
  const adj=new Map(ev.map(e=>[e,[]]));for(const [a,b] of edges){adj.get(a).push(b);adj.get(b).push(a);}
  const par=new Map([[anchor,null]]),dep=new Map([[anchor,0]]);const q=[anchor];
  while(q.length){const u=q.shift();for(const v of adj.get(u))if(!par.has(v)){par.set(v,u);dep.set(v,dep.get(u)+1);q.push(v);}}
  const maxD=Math.max(...dep.values());
  if(cfg.minDepth&&maxD<cfg.minDepth)return null;
  const asked=rng.pick(ev.filter(e=>dep.get(e)===maxD));
  const path=[];for(let x=asked;x;x=par.get(x))path.unshift(x);
  const clues=edges.map(([a,b])=>{const [s,r]=rng.chance(.5)?[a,b]:[b,a];return relPhrase(rng,s,r,s.t-r.t,cfg.hours);});
  clues.push(`${anchor.L} olayı saat ${locT(anchor.t)} gerçekleşti.`);
  const qs=[];
  if(cfg.askTime!==false)qs.push({id:'t',type:'time',label:`${asked.L} olayı saat kaçta gerçekleşti?`,short:`${asked.L} olayının saati`,ans:asked.t});
  if(cfg.dur)qs.push({id:'d',type:'num',label:cfg.durLabel||'İlk olay ile son olay arasında kaç dakika geçti?',short:'Toplam süre',ans:chron[n-1].t-chron[0].t});
  if(cfg.consist){const cand=ev.filter(e=>e!==anchor&&e!==asked);const x=rng.pick(cand);const truth=rng.chance(.5);const claimed=truth?x.t:x.t+(rng.chance(.5)?1:-1)*5*rng.int(1,4);
    qs.push({id:'c',type:'yn',label:`Bir tanık “${x.L} olayı saat ${locT(claimed)} oldu” diyor. Bu ifade dosyadaki kayıtlarla tutarlı mı?`,short:'Tanık ifadesi',ans:truth});}
  // açıklama
  const signed=[];for(let i=1;i<path.length;i++)signed.push(path[i].t-path[i-1].t);
  const expr=arr=>fmtT(anchor.t)+' '+arr.map(d=>(d>=0?'+ ':'− ')+Math.abs(d)+' dk').join(' ');
  const val=arr=>anchor.t+arr.reduce((a,b)=>a+b,0);
  const pre=`Saati kesin bilinen ${anchor.L} olayından başladım ve ${path.map(p=>p.L).join(' → ')} yolunu izledim: `;
  const correct=pre+`${expr(signed)} = ${fmtT(val(signed))}.`;
  const ds=[];const flips=rng.shuffle(signed.map((d,i)=>signed.map((x,j)=>j===i?-x:x)));
  if(flips.length)ds.push(pre+`${expr(flips[0])} = ${fmtT(val(flips[0]))}.`);
  const absA=signed.map(Math.abs),negA=signed.map(x=>-Math.abs(x));
  for(const A of [absA,negA])if(A.some((x,i)=>x!==signed[i]))ds.push(pre+`${expr(A)} = ${fmtT(val(A))}.`);
  if(flips.length>1)ds.push(pre+`${expr(flips[1])} = ${fmtT(val(flips[1]))}.`);
  const generic=[`Kayıtları dosyada yazıldıkları sıraya göre dizdim; ${asked.L} olayının saatini tüm dakikaları toplayıp başlangıç saatine ekleyerek buldum.`,`${asked.L} olayının adı en son yaşanacak bir olaya benzediği için onu en sona koydum ve saatini tahmin ettim.`];
  const dsel=[ds[0],ds[1]||generic[1],generic[0],ds[2],generic[1]].filter(Boolean);
  const steps=path.slice(1).slice(-4).map(p=>({q:`${p.L} olayının saati`,a:p.t,type:'time'}));
  if(steps.length<2)steps.unshift({q:`${chron[0].L} ile ${chron[n-1].L} olayları arasındaki süre (dakika)`,a:chron[n-1].t-chron[0].t,type:'num'});
  const mid=ev.filter(e=>e!==anchor&&e!==asked);const hx=rng.pick(mid);
  return{kind:'timeline',events:ev,clues:rng.shuffle(clues),qs,order:chron.map(e=>e.L),chron,anchor,
    explain:{choices:mkChoices(rng,correct,dsel),steps,keys:[fmtT(anchor.t),...signed.map(d=>String(Math.abs(d))),'önce','sonra','ekle','çıkar','topla','dakika','saat','geri','ileri','başla','sıra','zincir']},
    hints:[`Başlangıç noktan: saati kesin olarak verilen tek olay ${anchor.L} (${fmtT(anchor.t)}). Diğer bütün saatler ona bağlı.`,'“Sonra” gördüğünde dakikaları ekle, “önce” gördüğünde çıkar. Bulduğun her saati olay kartının yanına not et.',`Kontrol noktası: ${hx.L} olayının saati ${fmtT(hx.t)}.`],
    summary:`Doğru sıra: ${chron.map(e=>`${e.L} (${fmtT(e.t)})`).join(' → ')}`};
}
function genTimelineRatio(rng){
  for(let att=0;att<50;att++){
    const m=rng.pick([2,3]),k=5*rng.int(2,5),big=m*k,firstBig=rng.chance(.5);
    const g1=5*rng.int(3,8),g4=5*rng.int(3,8),t0=5*rng.int(96,156);
    const T=[t0,t0+g1];T.push(T[1]+(firstBig?big:k));T.push(T[2]+(firstBig?k:big));T.push(T[3]+g4);
    const x=5*rng.int(1,6)*(rng.chance(.5)?1:-1),t5=T[2]+x;
    if(T.includes(t5))continue;
    const times=[...T,t5];const names=rng.shuffle(EVENT_POOL).slice(0,6);const L=rng.shuffle(LET.slice(0,6));
    const ev=times.map((t,i)=>({L:L[i],name:names[i],t}));
    const [e0,e1,e2,e3,e4,e5]=ev;
    const sorted=ev.slice().sort((a,b)=>a.L<b.L?-1:1);
    const chron=ev.slice().sort((a,b)=>a.t-b.t);
    const clues=[`${e0.L} olayı saat ${locT(e0.t)} gerçekleşti.`,`${e4.L} olayı saat ${locT(e4.t)} gerçekleşti.`,
      `${e1.L} olayı, ${e0.L} olayından ${g1} dakika sonra gerçekleşti.`,`${e3.L} olayı, ${e4.L} olayından ${g4} dakika önce gerçekleşti.`,
      `${e2.L} olayı, ${e1.L} ile ${e3.L} olaylarının arasında bir zamanda gerçekleşti.`,
      firstBig?`${e1.L}–${e2.L} arasındaki süre, ${e2.L}–${e3.L} arasındaki sürenin ${m} katıdır.`:`${e2.L}–${e3.L} arasındaki süre, ${e1.L}–${e2.L} arasındaki sürenin ${m} katıdır.`,
      relPhrase(rng,e5,e2,x,false)];
    const tot=(m+1)*k;
    const correct=`${e1.L} ile ${e3.L} arası ${tot} dakika. Uzun parça kısa parçanın ${m} katı olduğundan bu süre ${m} + 1 = ${m+1} eşit parçaya bölünür; bir parça ${k} dakika. Buradan ${e2.L} = ${fmtT(T[2])} ve ${e5.L} = ${fmtT(t5)}.`;
    const wrong1=`${e1.L} ile ${e3.L} arası ${tot} dakika. Bu süreyi ${m} eşit parçaya böldüm; bir parça ${(tot/m).toLocaleString('tr-TR')} dakika oldu.`;
    const wrong2=`${e2.L} olayı, ${e1.L} ile ${e3.L} olaylarının tam ortasındadır; bu yüzden aradaki süreyi ikiye böldüm.`;
    const wrong3=`${e0.L} ile ${e4.L} arasındaki tüm süreyi ${m+1} eşit parçaya böldüm.`;
    return{kind:'timeline',events:sorted,clues:rng.shuffle(clues),order:chron.map(e=>e.L),chron,anchor:e0,
      qs:[{id:'t',type:'time',label:`${e2.L} olayı saat kaçta gerçekleşti?`,short:`${e2.L} olayının saati`,ans:T[2]},{id:'t2',type:'time',label:`${e5.L} olayı saat kaçta gerçekleşti?`,short:`${e5.L} olayının saati`,ans:t5}],
      explain:{choices:mkChoices(rng,correct,[wrong1,wrong2,wrong3]),steps:[{q:`${e1.L} ile ${e3.L} arasındaki toplam süre (dakika)`,a:tot,type:'num'},{q:'Kısa parçanın süresi (dakika)',a:k,type:'num'},{q:`${e2.L} olayının saati`,a:T[2],type:'time'}],
        keys:[String(tot),String(k),String(m),String(m+1),'kat','parça','böl','eşit','toplam','çıkar','fark','oran']},
      hints:[`Önce ${e1.L} ve ${e3.L} olaylarının saatlerini bul; ikisi de saati bilinen bir olaya doğrudan bağlı.`,`Uzun parça kısa parçanın ${m} katıysa, toplam süre kısa parçanın ${m+1} katıdır.`,`${e1.L} ile ${e3.L} arası toplam ${tot} dakika.`],
      summary:`Doğru sıra: ${chron.map(e=>`${e.L} (${fmtT(e.t)})`).join(' → ')}`};
  }
  return null;
}

/* ---------- BÖLÜM 2: SAYI IZGARASI ---------- */
const SEQ_CACHE={};
function seqs(type,N){const key=type+N;if(SEQ_CACHE[key])return SEQ_CACHE[key];const out=[];
  if(type==='AP'){const D=Math.floor(98/(N-1));for(let a=1;a<=99;a++)for(let d=-D;d<=D;d++){if(!d)continue;const l=a+(N-1)*d;if(l<1||l>99)continue;const s=new Array(N);for(let i=0;i<N;i++)s[i]=a+i*d;out.push(s);}}
  else if(type==='GEO'){for(let r=2;Math.pow(r,N-1)<=99;r++)for(let a=1;a*Math.pow(r,N-1)<=99;a++){const s=[a];for(let i=1;i<N;i++)s.push(s[i-1]*r);out.push(s);out.push(s.slice().reverse());}}
  else if(type==='FIB'){for(let a=1;a<=99;a++)for(let b=1;b<=99;b++){const s=[a,b];for(let i=2;i<N;i++)s.push(s[i-1]+s[i-2]);if(s[N-1]<=99)out.push(s);}}
  return SEQ_CACHE[key]=out;}
function rowFits(type,s){const N=s.length;if(s.some(v=>!Number.isInteger(v)||v<1||v>99))return false;
  if(type==='AP'){const d=s[1]-s[0];if(!d)return false;for(let i=2;i<N;i++)if(s[i]-s[i-1]!==d)return false;return true;}
  if(type==='GEO'){const chk=a=>{if(a[1]%a[0])return false;const r=a[1]/a[0];if(r<2)return false;for(let i=2;i<N;i++)if(a[i]!==a[i-1]*r)return false;return true;};return chk(s)||chk(s.slice().reverse());}
  if(type==='FIB'){for(let i=2;i<N;i++)if(s[i]!==s[i-1]+s[i-2])return false;return true;}return false;}
const ROW_TXT={AP:'soldan sağa sabit bir farkla artar ya da azalır.',GEO:'soldan sağa her sayı, bir öncekinin hep aynı tam sayıyla çarpımı ya da bölümüdür (×2, ÷3 gibi).',FIB:'üçüncü sayıdan itibaren her sayı, kendinden önceki iki sayının toplamıdır.'};
const PROP_T={even:'çift',odd:'tek',prime:'asal',square:'tam kare'};
function propTest(p,v){if(p[0]==='m')return v%Number(p.slice(1))===0;if(p==='even')return v%2===0;if(p==='odd')return v%2===1;if(p==='prime')return isPrime(v);if(p==='square')return isSq(v);return false;}
function propText(p){return p[0]==='m'?ek(Number(p.slice(1)),'gen')+' katı':PROP_T[p];}
function relTest(x,va,vb){if(x.op==='gt')return va>vb;if(x.op==='k')return va===x.k*vb;if(x.op==='plus')return va===vb+x.k;return false;}
const cellName=(r,c)=>COLS[c]+(r+1);
function relText(x){const a=cellName(...x.a),b=cellName(...x.b);if(x.op==='gt')return `${a} hücresindeki sayı, ${b} hücresindekinden büyük.`;if(x.op==='k')return `${a} hücresindeki sayı, ${b} hücresindekinin ${x.k} katı.`;return `${a} hücresindeki sayı, ${b} hücresindekinden ${x.k} fazla.`;}
function propOptions(rng,v){const o=[];if(isPrime(v)&&v>2)o.push(['prime']);if(isSq(v)&&v>1)o.push(['square']);const par=v%2===0?'even':'odd';
  for(const k of [3,5,7,9,11])if(v%k===0&&v!==k)o.push([par,'m'+k]);if(v%2===0)for(const k of [4,6,8])if(v%k===0&&v!==k)o.push(['m'+k]);return o.length?rng.pick(o):null;}
function makeRel(rng,a,b,sol){let va=sol[a[0]][a[1]],vb=sol[b[0]][b[1]];if(va===vb)return null;if(va<vb){[a,b]=[b,a];[va,vb]=[vb,va];}

function randSeed(){return Math.floor(Math.random()*2147483647)+1;}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function solvedCount(){return CASES.filter(c=>S.cases[c.id]&&S.cases[c.id].solved).length;}
function teacherAdj(){return S.expl.reduce((s,e)=>s+(e.teacher===false&&e.autoOk?-e.bonus:0)+(e.teacher===true&&!e.autoOk?50:0),0);}
function totalScore(){return CASES.reduce((s,c)=>s+(S.cases[c.id]?S.cases[c.id].best:0),0)+teacherAdj();}
function rankOf(n){let r=RANKS[0];for(const x of RANKS)if(n>=x.min)r=x;return r;}
function nextRank(n){return RANKS.find(x=>x.min>n)||null;}
function chDone(ch){return CASES.filter(c=>c.ch===ch).every(c=>S.cases[c.id]&&S.cases[c.id].solved);}
function cnt(f){return CASES.filter(c=>S.cases[c.id]&&f(S.cases[c.id],c)).length;}
function badgeTest(id){switch(id){case 'zaman':return chDone(1);case 'izgara':return chDone(2);case 'sifre':return chDone(3);case 'celiski':return chDone(4);
  case 'final':return cnt((x,c)=>c.ch===5&&x.solved)>0;case 'keskin':return cnt(x=>x.noHint)>=5;case 'ilk':return cnt(x=>x.first)>=5;case 'gerekce':return cnt(x=>x.expl)>=8;case 'hiz':return cnt(x=>x.fast)>=3;case 'ileri':return cnt((x,c)=>c.level==='ileri'&&x.solved)>=8;}return false;}
function updateBadges(){const fresh=[];for(const b of BADGES)if(!S.badges.includes(b.id)&&badgeTest(b.id)){S.badges.push(b.id);fresh.push(b);}return fresh;}

  for(const [f,t] of seq){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.12,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2);}}catch(e){}}

    const st=S.cases[id];if(st&&st.solved){showModal(`<h2>DOSYA ${id} · ${c.title}</h2><p>Bu dosyayı daha önce çözdün (en iyi puan: <b>${st.best}</b>). Nasıl devam etmek istersin?</p>

/* ---------- ortak bileşenler ---------- */
const IM=COARSE?'none':'numeric';
function clueList(items,cls=''){return `<ol class="clues">${items.map((c,i)=>{const o=typeof c==='string'?{text:c}:c;return `<li class="clue ${cls}" ${o.key?`data-key="${o.key}"`:''}><span class="cn">${i+1}</span><span>${o.text}</span></li>`;}).join('')}</ol>`;}
const numIn=(id,ph='?')=>`<input class="num" id="${id}" data-num autocomplete="off" inputmode="${IM}" placeholder="${ph}">`;
const timeIn=id=>`<input class="tin" id="${id}" data-time autocomplete="off" inputmode="${COARSE?'none':'decimal'}" placeholder="SS.DD" maxlength="5">`;
function keypadHTML(){const k=['1','2','3','4','5','6','7','8','9','0','−','.'];return `<div class="keypad">${k.map(x=>`<button class="kp" data-k="${x}" type="button">${x}</button>`).join('')}<button class="kp wide" data-k="del" type="button">⌫ Sil</button><button class="kp wide" data-k="clr" type="button">Temizle</button></div>`;}
const partsMsg=parts=>`<ul class="parts">${parts.map(([n,ok])=>`<li class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${n}</li>`).join('')}</ul>`;
function markIn(el,ok){if(!el)return;el.classList.remove('right','wrong');el.classList.add(ok?'right':'wrong');}
const ENC=['Her yanlış deneme bir olasılığı eler. Farklı bir ipucundan başlamayı dene.','İyi dedektifler hipotez kurar ve sınar. Bir varsayımını değiştir ve yeniden kontrol et.','Kayıtları tek tek yeniden oku; küçük bir ayrıntı her şeyi değiştirebilir.','Stratejini değiştir: önce en kesin bilgiyi bul, sonra ona bağlı olanları çöz.','Hangi kısmın doğru olduğunu not et ve yalnızca şüpheli kısma odaklan.'];

/* ---------- zaman çizelgesi ---------- */
function ctrlTimeline(P,fileEl,workEl,opt={}){
  fileEl.innerHTML=`${opt.preFile||''}<h4 class="sec">Olay kartları</h4><div class="ev-list">${P.events.map(e=>`<div class="ev"><b>${e.L}</b><span>${e.name}</span></div>`).join('')}</div>
   <h4 class="sec">Kayıtlar <small>(okuduğun kaydı işaretlemek için dokun)</small></h4>${clueList(P.clues,'lg')}`;
  const ui={order:[],yn:{}};const n=P.events.length;
  workEl.innerHTML=`${opt.preWork||''}<h4 class="sec">1 · Olayları zaman sırasına diz <small>(karta dokun → sıraya girer · sıradakine dokun → geri döner)</small></h4>
   <div class="tl-pool" id="tlPool"></div><div class="tl-track" id="tlTrack"></div>
   <h4 class="sec">2 · Hesapla ve değerlendir</h4>
   <div class="qs">${P.qs.map(q=>`<div class="q"><span>${q.label}</span>${q.type==='time'?timeIn('q_'+q.id):q.type==='num'?numIn('q_'+q.id):`<div class="yn" data-q="${q.id}"><button type="button" data-v="1">Tutarlı</button><button type="button" data-v="0">Tutarsız</button></div>`}</div>`).join('')}</div>
   ${keypadHTML()}`;
  const ev=L=>P.events.find(e=>e.L===L);
  function draw(){
    $('#tlPool').innerHTML=P.events.filter(e=>!ui.order.includes(e.L)).map(e=>`<button type="button" class="tl-card" data-l="${e.L}"><b>${e.L}</b><span>${e.name}</span></button>`).join('')||'<span class="muted" style="padding:.6rem">Tüm kartlar yerleştirildi.</span>';
    let t='';for(let i=0;i<n;i++){const L=ui.order[i];t+=(i?'<span class="arr">→</span>':'')+(L?`<button type="button" class="slot filled" data-i="${i}"><span><b>${L}</b><small>${i+1}.</small></span></button>`:`<div class="slot">${i+1}.</div>`);}
    $('#tlTrack').innerHTML=t;
    $$('#tlPool .tl-card').forEach(b=>b.onclick=()=>{ui.order.push(b.dataset.l);draw();});
    $$('#tlTrack .slot.filled').forEach(b=>b.onclick=()=>{ui.order.splice(+b.dataset.i,1);draw();});}
  draw();
  $$('.yn',workEl).forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{ui.yn[g.dataset.q]=b.dataset.v==='1';$$('button',g).forEach(x=>x.classList.toggle('sel',x===b));}));
  return{check(){
    if(ui.order.length<n)return{soft:true,msg:'Önce tüm olay kartlarını zaman çizelgesine yerleştir.'};
    const parts=[];let all=true;const ordOK=ui.order.join('')===P.order.join('');parts.push(['Sıralama',ordOK]);all=all&&ordOK;
    for(const q of P.qs){const el=$('#q_'+q.id);let ok;
      if(q.type==='time'){const v=parseT(el.value);if(v==null)return{soft:true,msg:'Saatleri SS.DD biçiminde yaz (örnek: 09.35).'};ok=v===((q.ans%1440)+1440)%1440;markIn(el,ok);}
      else if(q.type==='num'){const v=parseNum(el.value);if(v==null)return{soft:true,msg:'Dakika sorusuna bir tam sayı yaz.'};ok=v===q.ans;markIn(el,ok);}
      else{if(ui.yn[q.id]==null)return{soft:true,msg:'Tanık ifadesi için “Tutarlı” ya da “Tutarsız” seç.'};ok=ui.yn[q.id]===q.ans;}
      parts.push([q.short,ok]);all=all&&ok;}
    return{ok:all,msg:all?'Zaman çizelgesi doğrulandı.':'Bazı bölümler hatalı:'+partsMsg(parts)};},
   solve(){ui.order=P.order.slice();draw();for(const q of P.qs){if(q.type==='time')$('#q_'+q.id).value=fmtT(q.ans);else if(q.type==='num')$('#q_'+q.id).value=q.ans;else ui.yn[q.id]=q.ans;}}};}

/* ---------- ızgara ---------- */
function ctrlGrid(P,fileEl,workEl,opt={}){const N=P.N;
  fileEl.innerHTML=`${opt.preFile||''}<h4 class="sec">Kurallar ve koşullar <small>(dokunarak işaretle)</small></h4>${clueList(P.clues)}`;
  let h='<div class="grid-wrap"><table class="grid"><tr><th></th>'+COLS.slice(0,N).map(c=>`<th>${c}</th>`).join('')+'</tr>';
  for(let r=0;r<N;r++){h+=`<tr><th>${r+1}</th>`;for(let c=0;c<N;c++){const key=r*N+c;const star=P.star&&P.star[0]===r&&P.star[1]===c;
      h+=`<td><div class="cellw ${star?'star':''}">${P.givens.has(key)?`<div class="cell given">${P.givens.get(key)}</div>`:`<input class="cell" data-num data-r="${r}" data-c="${c}" maxlength="2" autocomplete="off" inputmode="${IM}" aria-label="${cellName(r,c)}">`}</div></td>`;}h+='</tr>';}
  h+='<tr><th>Σ</th>'+P.sums.map((v,c)=>`<td class="sumcell ${c===P.link?'link':''}">${v==null?'':c===P.link?'Aşama 1':v}</td>`).join('')+'</tr></table></div>';
  workEl.innerHTML=`${opt.preWork||''}<h4 class="sec">Izgarayı tamamla <small>(hücreye dokun, sayıyı yaz · ok tuşlarıyla gezin)${P.star?' · ★ hücresi kasa anahtarıdır':''}</small></h4>${h}${keypadHTML()}`;
  const inputs=$$('input.cell',workEl);
  inputs.forEach(inp=>inp.addEventListener('keydown',e=>{const r=+inp.dataset.r,c=+inp.dataset.c;const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(!mv)return;e.preventDefault();
    for(let k=1;k<N;k++){const t=$(`input.cell[data-r="${r+mv[0]*k}"][data-c="${c+mv[1]*k}"]`,workEl);if(t){t.focus();break;}}}));
  return{check(){
    const g=P.sol.map(row=>row.slice());let blank=0;
    for(const inp of inputs){const v=parseNum(inp.value);if(v==null)blank++;g[+inp.dataset.r][+inp.dataset.c]=v;}
    if(blank)return{soft:true,msg:`Tüm boş hücreleri doldur (${blank} boş hücre kaldı).`};
    $$('.clue',fileEl).forEach(li=>li.classList.remove('bad'));
    if(g.every((row,r)=>row.every((v,c)=>v===P.sol[r][c])))return{ok:true,msg:'Izgaradaki tüm kurallar sağlanıyor.'};
    const bad=[];if(g.some(row=>row.some(v=>v<1||v>99)))bad.push('global');
    P.types.forEach((t,r)=>{if(!rowFits(t,g[r]))bad.push('row'+r);});
    P.sums.forEach((v,c)=>{if(v!=null&&g.reduce((s,row)=>s+row[c],0)!==v)bad.push('sum'+c);});
    for(const [key,ps] of P.props){const v=g[Math.floor(key/N)][key%N];if(!ps.every(p=>propTest(p,v)))bad.push('prop'+key);}
    P.rels.forEach((x,i)=>{if(!relTest(x,g[x.a[0]][x.a[1]],g[x.b[0]][x.b[1]]))bad.push('rel'+i);});
    bad.forEach(k=>{const li=$(`.clue[data-key="${k}"]`,fileEl);if(li){li.classList.add('bad');li.classList.remove('marked');}});
    return{ok:false,msg:bad.length?`Yerleşiminde <b>${bad.length}</b> kural sağlanmıyor (dosyada kırmızıyla işaretlendi). Bu kurallara bağlı hücreleri yeniden düşün.`:'Bu yerleşim kuralları sağlıyor gibi görünüyor ama tek çözüm bu değil; hücre koşullarını yeniden kontrol et.'};},
   solve(){inputs.forEach(inp=>inp.value=P.sol[+inp.dataset.r][+inp.dataset.c]);}};}

function ctrlPattern(P,fileEl,workEl){

/* ---------- iki kural ---------- */
function ctrlPattern2(P,fileEl,workEl){let phase=0;const sel=new Set();let pick=null;
  function draw(){
    fileEl.innerHTML=`<h4 class="sec">Kayıtlar</h4>${clueList([...P.pairs.map(([x,y])=>`${x} → ${y}`),...(phase?[`EK İPUCU: ${P.extra[0]} → ${P.extra[1]}`]:[])],'lg')}
      <h4 class="sec">Uzmanların önerdiği kurallar</h4>${clueList(P.opts.map(o=>`<span class="mono">${o.t}</span>`))}`;
    const pairs=`<div class="pairs">${P.pairs.map(([x,y])=>`<div class="pair">${x} <span class="ar">⟶</span> ${y}</div>`).join('')}${phase?`<div class="pair extra">${P.extra[0]} <span class="ar">⟶</span> ${P.extra[1]} <small style="font-size:.5em">ek ipucu</small></div>`:''}</div>`;
    if(phase===0){workEl.innerHTML=`<h4 class="sec">Adım 1 · İlk iki eşleşmeye uyan TÜM kuralları seç <small>(birden fazla olabilir)</small></h4>${pairs}<div class="opts-list" style="margin-top:1rem">${P.opts.map((o,i)=>`<button type="button" class="opt ${sel.has(i)?'sel':''}" data-i="${i}">${sel.has(i)?'☑':'☐'} ${o.t}</button>`).join('')}</div><p class="muted" style="font-size:.85em">Adım 1 doğru olunca ek ipucu zarfı açılacak.</p>`;
      $$('.opt',workEl).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);draw();});}
    else{workEl.innerHTML=`<h4 class="sec">Adım 2 · Ek ipucu açıldı: hangi kural TÜM kayıtlara uyuyor?</h4>${pairs}<div class="opts-list" style="margin-top:1rem">${P.opts.map((o,i)=>`<button type="button" class="opt ${pick===i?'sel':''}" data-i="${i}">${pick===i?'◉':'○'} ${o.t}</button>`).join('')}</div>
      <div class="q" style="margin-top:1rem"><span>Bu kurala göre <b>${P.m}</b> girilirse çıktı ne olur?</span>${numIn('p2Ans')}</div>${keypadHTML()}`;
      $$('.opt',workEl).forEach(b=>b.onclick=()=>{pick=+b.dataset.i;const v=$('#p2Ans').value;draw();$('#p2Ans').value=v;});}}
  draw();
  return{check(){
    if(phase===0){if(!sel.size)return{soft:true,msg:'En az bir kural seç.'};const ok=P.opts.every((o,i)=>o.fit2===sel.has(i));
      if(ok){phase=1;draw();return{ok:true,advance:true,msg:'Doğru! İlk iki eşleşmeye tam olarak iki kural uyuyor. <b>Ek ipucu zarfı açıldı</b>; şimdi gerçeği bul.'};}
      const c=[...sel].filter(i=>P.opts[i].fit2).length;return{ok:false,msg:`Seçimin tam doğru değil. Seçtiklerinden ${c} tanesi gerçekten uyuyor. Her kuralı iki eşleşmede de hesapla.`};}
    if(pick==null)return{soft:true,msg:'Tüm kayıtlara uyan kuralı seç.'};const v=parseNum($('#p2Ans').value);if(v==null)return{soft:true,msg:'Çıktı için bir tam sayı yaz.'};
    const okR=P.opts[pick].all,okV=v===P.ans;markIn($('#p2Ans'),okV);return{ok:okR&&okV,msg:okR&&okV?'Gerçek kural ortaya çıktı.':'Bazı bölümler hatalı:'+partsMsg([['Kural seçimi',okR],['Çıktı',okV]])};},
   solve(){if(phase===0){P.opts.forEach((o,i)=>o.fit2&&sel.add(i));draw();}else{pick=P.opts.findIndex(o=>o.all);draw();$('#p2Ans').value=P.ans;}}};}

  function draw(){workEl.innerHTML=`<h4 class="sec">Kelimeyi çöz <small>(kutuya dokun, sonra harfi seç)</small></h4>

   solve(){P.letters.forEach((ch,i)=>ans[i]=ch);draw();}};}

function ctrlOps(P,fileEl,workEl){const k=P.ops.length;const ops=new Array(k).fill('');

    return{ok,msg:ok?'Eşitlik sağlandı.':v===null?'Bu dizilimde bir bölme tam bölünmüyor. İşlemleri yeniden düşün.':`Bu dizilimin sonucu ${v}, hedef ${P.target}. İşlem önceliğini unutma!`};},

function ctrlFinal(P,fileEl,workEl){let sub=null;
  const bar=()=>`<div class="stages">${['Zaman Çizelgesi','Sayı Izgarası','Kasa Şifresi'].map((t,i)=>`<div class="stg ${i<P.stage?'done':i===P.stage?'cur':'lock'}"><b>Aşama ${i+1}${i<P.stage?' ✓':i>P.stage?' 🔒':''}</b><span>${t}</span></div>`).join('<i>→</i>')}</div>`;
  const note=()=>P.stage?`<div class="notebook"><div class="lbl">Dedektif defteri · senin bulguların</div>${P.stage>=1?`<div>Aşama 1 · ilk ve son olay arası: <b>${P.S} dakika</b></div>`:''}${P.stage>=2?`<div>Aşama 2 · ★ hücresi (${cellName(P.star[0],P.star[1])}): <b>${P.G}</b></div>`:''}</div>`:'';
  function build(){const o={preWork:bar(),preFile:note()};
    if(P.stage===0)sub=ctrlTimeline(P.tl,fileEl,workEl,o);else if(P.stage===1)sub=ctrlGrid(P.grid,fileEl,workEl,o);
    else{fileEl.innerHTML=`${o.preFile}<h4 class="sec">Kasa mekanizması</h4>${clueList(['Kasanın üzerinde gizemli bir ◆ işlemi var. a ◆ b, a ve b sayılarından tek bir kuralla hesaplanır.',...P.ex.map(([a,b,r])=>`<span class="mono">${a} ◆ ${b} = ${r}</span>`),'Kasa kodu = ★ ◆ (Aşama 1 sonucu)'],'lg')}`;
      workEl.innerHTML=`${o.preWork}<h4 class="sec">Kasa şifresini hesapla</h4><div class="pairs">${P.ex.map(([a,b,r])=>`<div class="pair">${a} ◆ ${b} <span class="ar">=</span> ${r}</div>`).join('')}<div class="pair query">★ ◆ (Aşama 1) <span class="ar">=</span> ${numIn('fAns')}</div></div>${keypadHTML()}`;
      sub={check(){const v=parseNum($('#fAns').value);if(v==null)return{soft:true,msg:'Kasa kodunu bir sayı olarak yaz.'};const ok=v===P.code;markIn($('#fAns'),ok);return{ok,msg:ok?'KASA AÇILDI!':'Kasa açılmadı. ◆ kuralını üç örnekte de dene ve doğru sayıları yerine koyduğundan emin ol.'};},solve(){$('#fAns').value=P.code;}};}}
  build();
  return{check(){const r=sub.check();if(r.ok&&P.stage<2){P.stage++;build();return{ok:true,advance:true,award:100,msg:`<b>Aşama ${P.stage} tamamlandı (+100).</b> Sonucun dedektif defterine kaydedildi. Aşama ${P.stage+1} açıldı.`};}return r;},
    hints(){return P.hintsByStage[P.stage];},stageKey(){return P.stage;},solve(){sub.solve();}};}

const CTRL={timeline:ctrlTimeline,grid:ctrlGrid,pattern:ctrlPattern,pattern2:ctrlPattern2,letters:ctrlLetters,ops:ctrlOps,contra:ctrlContra,contraQty:ctrlContra,final:ctrlFinal};

/* ---------- dosya akışı ---------- */
let play=null,timerInt=null;
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}
function stagesOf(P){return P.kind==='final'?3:1;}
function targetOf(def){return TARGET[def.level]*(def.ch===5?2.5:1);}
function elapsed(){return play?((play.solvedAt||Date.now())-play.t0)/1000:0;}
function solvePts(){const base=100*play.stages;const pen=Math.min(play.wrong*10,base*.5)+play.hints*15;return Math.max(Math.round(base*.25),base-pen);}
function updMeta(){if(!play)return;const tb=$('#timerBox');if(tb){if(S.timer&&play.phase==='solve'){const e=elapsed(),t=targetOf(play.def);tb.innerHTML=`<span class="timer ${e>t?'over':''}">⏱ ${mmss(e)}</span><small class="muted">${e<=t?`Hedef ${mmss(t)} → +25`:'Hedef geçti; acele etme, düşünmeye devam'}</small>`;}else tb.innerHTML='';}
  const pb=$('#potBox');if(pb&&play.phase==='solve')pb.innerHTML=`Olası puan: <b>${solvePts()}</b> <small class="muted">+50 açıklama</small>`;}
function openCase(id,reseed){const def=CASE_BY_ID[id];const c=cs(id);if(reseed)c.seed=randSeed();save();
  app.innerHTML='<div class="loading">DOSYA HAZIRLANIYOR…<br><small>Bulmaca üretiliyor ve tek çözümlü olduğu doğrulanıyor</small></div>';
  setTimeout(()=>{const P=buildCase(def,c.seed);if(!P){c.seed=randSeed();save();app.innerHTML='<div class="loading">Dosya oluşturulamadı, yeniden deneniyor…</div>';setTimeout(()=>openCase(id,false),50);return;}
    play={id,def,P,stages:stagesOf(P),wrong:0,hints:0,hintIdx:{},t0:Date.now(),solvedAt:null,phase:'solve',ex:null};renderCase();},30);}
function renderCase(){const {def,P}=play;stopTimer();
  app.innerHTML=`<div class="pop"><div class="case-head">
     <button class="btn ghost" data-act="board">← Pano</button>
     <div class="case-title"><span class="code">DOSYA ${def.id}</span><h2>${def.title}</h2><span class="lvl ${def.level}">${LVL_NAME[def.level]}</span></div>
     <div class="case-meta"><span id="timerBox"></span><span class="pot" id="potBox"></span></div></div>
   <div class="case-body">
     <section class="panel file"><span class="file-tag">GİZLİ DOSYA</span><div class="story">${def.story}</div><div id="fileBox"></div></section>
     <section class="panel work"><div id="workBox"></div><div id="fb" class="feedback"></div>
       <div class="actions" id="caseActions"><button class="btn warn" id="hintBtn">💡 İpucu al (−15)</button><button class="btn primary" id="checkBtn">Kontrol Et ✓</button></div>
       <div class="hint-list" id="hintList"></div></section></div></div>`;
  play.ctrl=CTRL[P.kind](P,$('#fileBox'),$('#workBox'));
  $('#checkBtn').onclick=doCheck;$('#hintBtn').onclick=doHint;drawHints();updMeta();timerInt=setInterval(updMeta,1000);window.scrollTo({top:0});}
function curHints(){return play.ctrl.hints?play.ctrl.hints():play.P.hints;}
function stageKey(){return play.ctrl.stageKey?play.ctrl.stageKey():0;}
function drawHints(){const k=stageKey(),used=play.hintIdx[k]||0,list=curHints();
  $('#hintList').innerHTML=list.slice(0,used).map((h,i)=>`<div class="hint"><b>İpucu ${i+1}:</b> ${h}</div>`).join('');
  $('#hintBtn').textContent=used>=list.length?'İpucu kalmadı':`💡 İpucu al (−15) · ${list.length-used} kaldı`;$('#hintBtn').disabled=used>=list.length;}
function doHint(){const k=stageKey(),used=play.hintIdx[k]||0,list=curHints();if(used>=list.length)return;play.hintIdx[k]=used+1;play.hints++;beep('hint');drawHints();updMeta();}
function fb(msg,cls){const el=$('#fb');el.className='feedback '+cls;el.innerHTML=msg;if(cls==='bad'){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}}
function doCheck(){const r=play.ctrl.check();
  if(r.soft){fb('ℹ️ '+r.msg,'soft');return;}
  if(r.ok&&r.advance){beep('ok');fb('✓ '+r.msg,'ok');drawHints();updMeta();return;}
  if(r.ok){beep('win');play.solvedAt=Date.now();play.phase='explain';updMeta();$('#potBox').innerHTML='';startExplain(r.msg);return;}
  play.wrong++;beep('bad');fb(`✗ ${r.msg}<div class="muted" style="margin-top:.4rem">🔎 ${ENC[play.wrong%ENC.length]}</div>`,'bad');updMeta();}

/* ---------- açıklama sistemi ---------- */
function startExplain(okMsg){const E=play.P.explain;play.ex={tries:0,bonus:0,done:false,lockedChoice:false,mode:'choice',pick:null};
  $('#caseActions').style.display='none';$('#hintList').innerHTML='';$('#fb').className='feedback';$('#fb').innerHTML='';
  const w=$('#workBox');w.innerHTML=`<div class="explain pop"><div class="banner">✓ Gizem çözüldü! ${okMsg||''}</div>
    <h3>Bu sonuca nasıl ulaştın?</h3><p class="muted" style="margin-top:-.3rem">Doğru matematiksel açıklama <b>+50</b> ek puan kazandırır. Bir yöntem seç:</p>
    <div class="tabs"><button class="tab" data-m="choice">☑ Gerekçeni seç</button><button class="tab" data-m="steps">🔢 Basamakları göster</button><button class="tab" data-m="text">✎ Kendi cümlelerinle yaz</button></div>
    <div id="exBody"></div><div id="exFb" class="feedback"></div>
    <div class="actions" id="exActions"><button class="btn ghost" id="exSkip">Açıklamadan geç</button><button class="btn primary" id="exSend">Açıklamayı gönder</button></div></div>`;
  $$('.tab',w).forEach(t=>t.onclick=()=>{if(t.disabled)return;play.ex.mode=t.dataset.m;drawEx();});
  $('#exSkip').onclick=finishCase;$('#exSend').onclick=sendEx;drawEx();}
function drawEx(){const E=play.P.explain,ex=play.ex,b=$('#exBody');
  $$('.tab').forEach(t=>{t.classList.toggle('sel',t.dataset.m===ex.mode);t.disabled=t.dataset.m==='choice'&&ex.lockedChoice;});
  if(ex.mode==='choice'){b.innerHTML=`<p>Aşağıdakilerden hangisi senin akıl yürütmeni <b>matematiksel olarak doğru</b> anlatıyor? <small class="muted">(Dikkat: bu yöntemde tek hakkın var.)</small></p>${E.choices.map((c,i)=>`<button type="button" class="choice ${ex.pick===i?'sel':''}" data-i="${i}">${String.fromCharCode(65+i)}) ${c.t}</button>`).join('')}`;
    $$('.choice',b).forEach(x=>x.onclick=()=>{ex.pick=+x.dataset.i;drawEx();});}
  else if(ex.mode==='steps'){b.innerHTML=`<p>Çözümünde kullandığın ara sonuçları yaz:</p><div class="qs">${E.steps.map((s,i)=>`<div class="q"><span>${i+1}. ${s.q}</span>${s.type==='time'?timeIn('st'+i):numIn('st'+i)}</div>`).join('')}</div>${keypadHTML()}`;}
  else{b.innerHTML=`<p>Hangi bilgiden başladın? Hangi işlemleri yaptın? Hangi kuralı buldun? Kullandığın <b>sayıları</b> ve <b>işlemleri</b> yaz.</p>
    <textarea class="ta" id="exText" placeholder="Örnek: Önce saati bilinen olaydan başladım. 09.20'ye 35 dakika ekleyince ikinci olay 09.55 oldu..."></textarea>`;}}
function evalText(txt,keys){const t=txt.toLocaleLowerCase('tr');const nums=keys.filter(k=>/\d/.test(k)),words=keys.filter(k=>!/\d/.test(k)).map(w=>w.toLocaleLowerCase('tr'));
  const numHit=nums.filter(k=>t.includes(k)).length,wordHit=words.filter(w=>t.includes(w)).length;
  if(t.replace(/\s/g,'').length<30)return{ok:false,msg:'Biraz daha ayrıntılı yaz: hangi bilgiden başladın, hangi işlemi yaptın?'};
  if(!numHit)return{ok:false,msg:'Açıklamanda çözümde kullandığın sayılardan en az birini yaz (ör. bir süre, bir toplam, bir çarpan).'};
  if(!wordHit)return{ok:false,msg:'Hangi işlemi ya da kuralı kullandığını belirt (ör. “ekledim”, “çıkardım”, “fark”, “toplam”, “katı”…).'};
  return{ok:true};}
function sendEx(){const E=play.P.explain,ex=play.ex;let ok=false,msg='';
  if(ex.mode==='choice'){if(ex.pick==null){exFb('Bir gerekçe seç.','soft');return;}ok=E.choices[ex.pick].ok;
    if(!ok){ex.lockedChoice=true;$$('.choice').forEach((x,i)=>x.classList.add(E.choices[i].ok?'':'wrongc'));msg='Bu gerekçe çözümle uyuşmuyor. Hangi adımın hatalı olduğunu bulmaya çalış. Açıklamayı başka bir yöntemle yeniden deneyebilirsin.';}}
  else if(ex.mode==='steps'){let all=true,empty=false;E.steps.forEach((s,i)=>{const el=$('#st'+i);const v=s.type==='time'?parseT(el.value):parseNum(el.value);if(v==null){empty=true;return;}const k=s.type==='time'?v===((s.a%1440)+1440)%1440:v===s.a;markIn(el,k);all=all&&k;});
    if(empty){exFb('Tüm basamakları doldur'+(E.steps.some(s=>s.type==='time')?' (saatleri SS.DD biçiminde yaz).':'.'),'soft');return;}ok=all;if(!ok)msg='Kırmızı işaretli basamakları yeniden hesapla.';}
  else{const txt=$('#exText').value.trim();const r=evalText(txt,E.keys);ok=r.ok;if(!ok){ex.tries++;if(ex.tries>=3)return closeEx(false,'Açıklama hakkın doldu. Öğretmenin yazdıklarını yine de inceleyebilir.',txt);exFb(r.msg,'soft');return;}
    const bonus=ex.tries===0?50:25;S.expl.push({id:Date.now(),caseId:play.id,text:txt,autoOk:true,bonus,teacher:null,date:new Date().toLocaleString('tr-TR')});save();return closeEx(true,'',null,bonus);}
  if(ok)return closeEx(true,'',null,ex.tries===0?50:25);
  ex.tries++;if(ex.tries>=3)return closeEx(false,'Açıklama hakkın doldu.');exFb(msg+` <small class="muted">(Kalan hak: ${3-ex.tries})</small>`,'bad');beep('bad');if(ex.mode==='choice')drawEx();}
function exFb(m,c){const el=$('#exFb');el.className='feedback '+c;el.innerHTML=m;}
function closeEx(ok,msg,failedText,bonus){const ex=play.ex;ex.done=true;ex.bonus=ok?bonus:0;
  if(!ok&&failedText){S.expl.push({id:Date.now(),caseId:play.id,text:failedText,autoOk:false,bonus:0,teacher:null,date:new Date().toLocaleString('tr-TR')});save();}
  if(ok)beep('ok');exFb(ok?`✓ Matematiksel açıklaman doğru! <b>+${bonus}</b> ek puan.`:msg,ok?'ok':'soft');
  $('#exActions').innerHTML='<button class="btn primary" id="exDone">Dosyayı kapat →</button>';$('#exDone').onclick=finishCase;}

/* ---------- dosyayı kapatma ---------- */
function finishCase(){stopTimer();const {id,def,P}=play;const c=cs(id);const prevRank=rankOf(solvedCount());
  const base=100*play.stages,sp=solvePts(),eb=play.ex&&play.ex.done?play.ex.bonus:0,e=elapsed();const fast=S.timer&&e<=targetOf(def);const tb=fast?25:0;const total=sp+eb+tb;
  c.solved=true;c.best=Math.max(c.best,total);c.plays++;c.hintsTotal+=play.hints;c.wrongTotal+=play.wrong;if(!play.hints)c.noHint=true;if(!play.wrong)c.first=true;if(eb)c.expl=true;if(fast)c.fast=true;if(c.bestTime==null||e<c.bestTime)c.bestTime=Math.round(e);
  const fresh=updateBadges();save();renderTop();const nr=rankOf(solvedCount());const rankUp=nr.name!==prevRank.name;
  const idx=CASES.findIndex(x=>x.id===id);const next=CASES.slice(idx+1).concat(CASES.slice(0,idx)).find(x=>!(S.cases[x.id]&&S.cases[x.id].solved)&&!(x.ch===5&&ch5Locked()));
  showModal(`<h2>📁 DOSYA ${id} KAPANDI</h2><p class="muted">${def.title}</p>
    <table class="score-tbl"><tr><td>Çözüm (${play.stages>1?play.stages+' aşama × 100':'doğru cevap'})</td><td>${base}</td></tr>
    ${play.wrong?`<tr><td>Yanlış deneme (${play.wrong} × −10, en fazla −%50)</td><td class="neg">−${Math.min(play.wrong*10,base*.5)}</td></tr>`:''}
    ${play.hints?`<tr><td>Kullanılan ipucu (${play.hints} × −15)</td><td class="neg">−${play.hints*15}</td></tr>`:''}
    <tr><td>Matematiksel açıklama</td><td class="${eb?'pos':''}">${eb?'+'+eb:'0'}</td></tr>
    ${S.timer?`<tr><td>Süre (${mmss(e)} / hedef ${mmss(targetOf(def))})</td><td class="${tb?'pos':''}">${tb?'+25':'0'}</td></tr>`:''}
    <tr class="tot"><td>Bu dosyadan kazanılan</td><td>${total}</td></tr></table>
    <p style="font-size:.9em"><b>Dosya özeti:</b> ${P.summary}</p>
    ${rankUp?`<div class="newbadge"><div class="badge on">★</div><div><b>Rütbe yükseldi!</b><br>Yeni rütben: <b style="color:var(--amber)">${nr.name}</b></div></div>`:''}
    ${fresh.map(b=>`<div class="newbadge"><div class="badge on">${b.icon}</div><div><b>Yeni rozet: ${b.name}</b><br><span class="muted">${b.desc}</span></div></div>`).join('')}
    <div class="row"><button class="btn ghost" data-x="board">Panoya dön</button><button class="btn" data-x="again">Yeni sayılarla tekrar</button>${next?`<button class="btn primary" data-x="next">Sonraki dosya: ${next.id} →</button>`:''}</div>`,m=>{
    $('[data-x=board]',m).onclick=()=>{closeModal();renderBoard();};$('[data-x=again]',m).onclick=()=>{closeModal();openCase(id,true);};if(next)$('[data-x=next]',m).onclick=()=>{closeModal();openCase(next.id,false);};});
  if(fresh.length||rankUp)beep('win');}

/* ---------- öğretmen paneli ---------- */
function teacherPanel(){const rows=CASES.map(c=>{const s=S.cases[c.id];return `<tr><td>${c.id}</td><td>${c.title}</td><td>${LVL_NAME[c.level]}</td><td>${s&&s.solved?'✓':'—'}</td><td>${s?s.best:0}</td><td>${s?s.plays:0}</td><td>${s?s.wrongTotal:0}</td><td>${s?s.hintsTotal:0}</td><td>${s&&s.expl?'✓':'—'}</td><td>${s&&s.bestTime!=null?mmss(s.bestTime):'—'}</td></tr>`;}).join('');
  const ex=S.expl.slice().reverse().map(e=>`<div class="expl-item" data-id="${e.id}"><b>DOSYA ${e.caseId}</b> · <span class="muted">${e.date}</span> · Otomatik değerlendirme: ${e.autoOk?`<span class="pos">kabul (+${e.bonus})</span>`:'<span class="neg">yetersiz</span>'}
    <div class="tx">${esc(e.text)}</div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn ${e.teacher===true?'primary':''}" data-tv="1" style="min-height:44px">Onayla${e.autoOk?'':' (+50)'}</button><button class="btn ${e.teacher===false?'warn':''}" data-tv="0" style="min-height:44px">Reddet${e.autoOk?` (−${e.bonus})`:''}</button>${e.teacher!=null?'<button class="btn ghost" data-tv="x" style="min-height:44px">Kararı kaldır</button>':''}</div></div>`).join('')||'<p class="muted">Henüz yazılı açıklama yok.</p>';
  showModal(`<h2>Öğretmen Paneli</h2><p>Öğrenci: <b>${esc(S.player)}</b> · Toplam puan: <b>${totalScore()}</b> · Çözülen: <b>${solvedCount()}/${CASES.length}</b> · Rütbe: <b>${rankOf(solvedCount()).name}</b></p>
    <div style="overflow-x:auto"><table class="t-tbl"><tr><th>Dosya</th><th>Başlık</th><th>Düzey</th><th>Çözüldü</th><th>En iyi</th><th>Oynama</th><th>Yanlış</th><th>İpucu</th><th>Açıklama</th><th>En iyi süre</th></tr>${rows}</table></div>
    <h3 style="margin-top:1.2rem">Öğrencinin yazılı açıklamaları</h3><p class="muted" style="font-size:.85em">Yazılı açıklamalar anahtar sayı ve kavramlara göre otomatik ön değerlendirmeden geçer. Son kararı siz verebilirsiniz; puan buna göre güncellenir.</p>${ex}
    <div class="row"><button class="btn" data-x="copy">Raporu panoya kopyala</button><button class="btn" data-x="unlock">${S.unlocked?'Final kilidini geri koy':'Tüm dosyaların kilidini aç'}</button><button class="btn warn" data-x="reset">İlerlemeyi sıfırla</button><button class="btn primary" data-x="close">Kapat</button></div>`,m=>{
    $$('.expl-item',m).forEach(it=>$$('[data-tv]',it).forEach(b=>b.onclick=()=>{const e=S.expl.find(x=>x.id===+it.dataset.id);e.teacher=b.dataset.tv==='x'?null:b.dataset.tv==='1';save();renderTop();teacherPanel();}));
    $('[data-x=close]',m).onclick=()=>{closeModal();if(!play)renderBoard();};
    $('[data-x=unlock]',m).onclick=()=>{S.unlocked=!S.unlocked;save();closeModal();if(!play)renderBoard();};
    $('[data-x=copy]',m).onclick=()=>{const t=`SAYI DEDEKTİFİ – İlerleme Raporu (${new Date().toLocaleDateString('tr-TR')})\nÖğrenci: ${S.player}\nToplam puan: ${totalScore()} · Çözülen: ${solvedCount()}/${CASES.length} · Rütbe: ${rankOf(solvedCount()).name}\nRozetler: ${S.badges.map(id=>BADGES.find(b=>b.id===id).name).join(', ')||'—'}\n\n`+CASES.map(c=>{const s=S.cases[c.id]||{};return `${c.id} ${c.title} [${LVL_NAME[c.level]}]: ${s.solved?'çözüldü':'çözülmedi'} · en iyi ${s.best||0} · yanlış ${s.wrongTotal||0} · ipucu ${s.hintsTotal||0} · açıklama ${s.expl?'doğru':'—'}`;}).join('\n')+'\n\nYazılı açıklamalar:\n'+S.expl.map(e=>`[${e.caseId}] ${e.text}`).join('\n');
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Rapor panoya kopyalandı.')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Rapor panoya kopyalandı.');}catch(e){}ta.remove();});};
    $('[data-x=reset]',m).onclick=()=>{if(confirm('Tüm ilerleme, puanlar ve açıklamalar silinecek. Emin misiniz?')){const name=S.player;S=defaultState();S.player=name;save();closeModal();renderTop();renderIntro();}};});}

/* ---------- genel olaylar ---------- */
let activeInput=null;
document.addEventListener('focusin',e=>{if(e.target.matches('input[data-num],input[data-time]'))activeInput=e.target;});
document.addEventListener('pointerdown',e=>{if(e.target.closest('.kp'))e.preventDefault();});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('input[data-num]')){const v=t.value.replace(/[^\d−-]/g,'');if(v!==t.value)t.value=v;}else if(t.matches('input[data-time]')){const v=t.value.replace(/[^\d.:]/g,'');if(v!==t.value)t.value=v;}});
document.addEventListener('click',e=>{
  const kp=e.target.closest('.kp');if(kp){let inp=activeInput;const scope=kp.closest('.work')||document;if(!inp||!document.body.contains(inp)||!scope.contains(inp))inp=$$('input[data-num],input[data-time]',scope).find(x=>!x.value)||$('input[data-num],input[data-time]',scope);if(!inp)return;
    const k=kp.dataset.k;if(k==='del')inp.value=inp.value.slice(0,-1);else if(k==='clr')inp.value='';else{if(inp.maxLength>0&&inp.value.length>=inp.maxLength)return;if(k==='.'&&!inp.matches('[data-time]'))return;if(k==='−'&&(!inp.matches('[data-num]')||inp.value))return;inp.value+=k==='−'?'-':k;}
    inp.focus();activeInput=inp;inp.dispatchEvent(new Event('input',{bubbles:true}));return;}
  const cl=e.target.closest('.clue');if(cl){cl.classList.toggle('marked');return;}
  const a=e.target.closest('[data-act]');if(a){const act=a.dataset.act;
    if(act==='board'){if(play&&play.phase==='solve'&&!confirm('Dosyadan çıkılsın mı? Bu dosyadaki ilerlemen kaydedilmez.'))return;if(play&&play.phase==='explain'){finishCase();return;}closeModal();S.started?renderBoard():renderIntro();}
    else if(act==='timer'){S.timer=!S.timer;save();renderTop();updMeta();toast(S.timer?'⏱ Zamana karşı mod açık: hedef sürede çözersen +25 bonus.':'🧠 Düşünme modu: süre yok.');}
    else if(act==='sound'){S.sound=!S.sound;save();renderTop();}
    else if(act==='teacher')teacherPanel();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&play&&play.phase==='solve'&&!$('#modalRoot').innerHTML&&e.target.matches('input')){e.preventDefault();doCheck();}});

/* ---------- otomatik test (?selftest) ---------- */
function selfTest(){const out=[];const t0=Date.now();const real=S;S=defaultState();S.sound=false;
  for(const def of CASES){for(let s=1;s<=4;s++){try{play=null;openCaseSync(def.id,s*7919+13);let done=false;
        for(let k=0;k<5&&!done;k++){play.ctrl.solve();const r=play.ctrl.check();if(r.soft||!r.ok)throw new Error('çözüm reddedildi: '+(r.msg||''));if(!r.advance)done=true;}
        if(!done)throw new Error('aşamalar bitmedi');const E=play.P.explain;if(E.choices.filter(c=>c.ok).length!==1||E.choices.length!==4)throw new Error('seçenek hatası');
        startExplain('');play.ex.mode='steps';drawEx();E.steps.forEach((st,i)=>{$('#st'+i).value=st.type==='time'?fmtT(st.a):st.a;});sendEx();if(!play.ex.done||play.ex.bonus!==50)throw new Error('basamak açıklaması reddedildi');
        finishCase();if(!S.cases[def.id].solved||S.cases[def.id].best<150)throw new Error('puan kaydı hatalı: '+S.cases[def.id].best);closeModal();
        out.push(`OK ${def.id} #${s}`);}catch(err){out.push(`HATA ${def.id} #${s}: ${err.message}`);}}}
  stopTimer();S=real;play=null;document.body.innerHTML=`<pre id="st">${out.filter(x=>x.startsWith('HATA')).join('\n')||'TÜM TESTLER GEÇTİ'}\n${out.length} test · ${Date.now()-t0} ms</pre>`;}
function openCaseSync(id,seed){const def=CASE_BY_ID[id];const P=buildCase(def,seed);if(!P)throw new Error('üretilemedi');play={id,def,P,stages:stagesOf(P),wrong:0,hints:0,hintIdx:{},t0:Date.now(),solvedAt:null,phase:'solve',ex:null};renderCase();}

/* ---------- başlat ---------- */
window.addEventListener('error',e=>{try{toast('⚠️ Beklenmeyen bir hata oluştu: '+esc(e.message));}catch(_){}});
if(location.search.includes('selftest'))selfTest();
else{renderTop();const q=new URLSearchParams(location.search);const d=q.get('dosya');
  if(d&&CASE_BY_ID[d]){S.started=true;openCase(d,false);}else if(q.has('pano')){S.started=true;renderBoard();}else S.started?renderBoard():renderIntro();}
</script>
